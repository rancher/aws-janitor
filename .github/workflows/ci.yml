name: Run CI checks

on: [pull_request, workflow_dispatch]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
        with:
          go-version: '1.21'
          check-latest: true
          cache: true
      - name: Build
        run: make build
      - name: Test
        run: make test
